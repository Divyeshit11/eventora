[build]
  # Netlify must publish Vite's production output, never the source directory.
  # NODE_ENV=production is needed by the API function, but Vite and its React
  # plugin are devDependencies and must be present while Netlify builds.
  command = "npm ci --include=dev && npm --prefix server ci && npm run build"
  publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"
